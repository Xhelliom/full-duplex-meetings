[project]
name = "fdm-join"
version = "0.2.0"
description = "Fait entrer le bot fdm dans une réunion Microsoft Teams (Chromium + Playwright)"
requires-python = ">=3.10"
dependencies = ["playwright>=1.45"]

[project.scripts]
fdm-join = "fdm_join.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fdm_join"]
